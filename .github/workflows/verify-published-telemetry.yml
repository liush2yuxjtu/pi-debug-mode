name: Verify published telemetry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  published-telemetry:
    if: github.head_ref == 'verify/published-telemetry-0.1.11'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-published-telemetry.mjs
